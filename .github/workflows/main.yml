name: 🚀 Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        
      - name: 🔍 Verify Game Files
        run: |
          echo "🎮 Checking for required game files..."
          files=("index.html" "game.js" "style.css" "config.js")
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ Found: $file"
            else
              echo "❌ Missing: $file"
              exit 1
            fi
          done
          echo "✅ All required files present!"
          
      - name: 📋 List Files
        run: |
          echo "📂 Repository Contents:"
          ls -lah
          
      - name: 🔧 Setup Pages
        uses: actions/configure-pages@v4
        
      - name: 📦 Upload Artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: '.'
          
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v3

  notify:
    needs: deploy
    runs-on: ubuntu-latest
    if: success()
    
    steps:
      - name: ✅ Success Notification
        run: |
          echo "🎉 Deployment Successful!"
          echo "🎮 Block Game is now live on GitHub Pages"
